<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Andres Ramos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --text: #17211d; --copy: #2a3833; --muted: #5d6b65; --line: #e4ece8; --accent: #0f6b58; --soft: #f3f7f5; --tint: #e5f4ef; --width: 860px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 16.5px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    ::selection { background: #d5efe7; }
    a { color: var(--accent); text-underline-offset: 3px; }
    .container { width: min(var(--width), calc(100% - 48px)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); }
    header nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .brand { color: var(--text); font-weight: 600; letter-spacing: -0.03em; text-decoration: none; }
    .nav-links { display: flex; gap: 22px; }
    .nav-links a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .nav-links a[aria-current="page"] { color: var(--text); }
    main { flex: 1; padding: 48px 0 20px; }
    h1 { margin: 0; font-size: clamp(36px, 5vw, 44px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.15; }
    .posts { display: flex; flex-direction: column; gap: 12px; margin: 28px 0 0; padding: 0; list-style: none; }
    .posts a { display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
    .posts a:hover { background: var(--soft); border-color: #d5e6df; }
    .posts time { display: block; color: var(--muted); font-size: 13px; }
    .posts h2 { margin: 2px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
    .posts p { margin: 6px 0 0; color: var(--copy); font-size: 15.5px; line-height: 1.55; }
    .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; height: auto; gap: 8px; margin-top: 22px; }
    .pager a, .pager span { min-width: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-align: center; text-decoration: none; font-size: 14px; }
    .pager a:hover { background: var(--soft); }
    .pager span { color: var(--muted); }
    .pager a[aria-current="page"], .pager span[aria-current="page"] { border-color: var(--accent); background: var(--tint); color: var(--accent); }
    .article { width: min(680px, 100%); }
    .article h1 { font-size: clamp(34px, 5vw, 46px); }
    .when { display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
    .content { margin-top: 28px; color: var(--copy); font-size: 17px; line-height: 1.75; }
    .content h2 { margin: 34px 0 10px; font-size: 22px; color: var(--text); letter-spacing: -0.03em; }
    .content h3 { margin: 26px 0 8px; font-size: 18px; color: var(--text); }
    .content p, .content ul, .content ol, .content blockquote { margin: 0 0 16px; }
    .content ul, .content ol { padding-left: 1.25em; }
    .content li + li { margin-top: 4px; }
    .content blockquote { margin-left: 0; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--soft); color: var(--copy); }
    .content pre { margin: 0 0 16px; padding: 16px 18px; overflow: auto; background: var(--soft); border-radius: 12px; font-size: 14px; line-height: 1.55; }
    .content code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
    .content p code, .content li code { padding: 1px 6px; background: var(--tint); border-radius: 6px; }
    footer { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; padding: 18px 0 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    @media (max-width: 560px) { .container { width: calc(100% - 32px); } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <nav class="container" aria-label="Navegación principal">
      <a class="brand" href="./">sakaramos</a>
      <div class="nav-links">
        <a href="./">Inicio</a>
        <a href="./blog.html" aria-current="page">Blog</a>
      </div>
    </nav>
  </header>
  <main id="blog" class="container"><h1>Blog</h1></main>
  <footer class="container">
    <span>Andres Ramos · Pitalito, Huila</span>
    <span>© <span id="year">2026</span></span>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    var blog = document.getElementById("blog");
    var posts = [];
    var PAGE = 10;

    load().then(show);
    window.addEventListener("hashchange", show);

    function load() {
      return discover().then(function (items) {
        posts = items.filter(Boolean).sort(function (a, b) {
          return a.id - b.id || a.name.localeCompare(b.name);
        });
      }).catch(function () {
        posts = [];
      });
    }

    function discover() {
      return listFolder().catch(listPublished);
    }

    function listFolder() {
      return fetch(new URL("posts/", location.href)).then(function (response) {
        if (!response.ok) throw new Error("sin lista");
        return response.text();
      }).then(function (html) {
        var names = [];
        html.replace(/href="([^"]+\.md)"/gi, function (_, href) {
          var name = decodeURIComponent(href.split("/").pop().split("?")[0]);
          if (/\.md$/i.test(name) && names.indexOf(name) === -1) names.push(name);
        });
        if (!names.length) throw new Error("sin archivos");
        return Promise.all(names.map(function (name) {
          return fetch(new URL("posts/" + encodeURIComponent(name), location.href)).then(function (response) {
            if (!response.ok) return null;
            return response.text().then(function (raw) { return toPost(name, raw); });
          });
        }));
      });
    }

    function listPublished() {
      var repo = publishedRepo();
      if (!repo) return Promise.resolve([]);
      return fetch("https://api.github.com/repos/" + repo + "/contents/posts").then(function (response) {
        if (!response.ok) throw new Error("sin posts");
        return response.json();
      }).then(function (items) {
        if (!Array.isArray(items)) return [];
        var files = items.filter(function (item) {
          return item && item.type === "file" && /\.md$/i.test(item.name) && item.download_url;
        });
        return Promise.all(files.map(function (item) {
          return fetch(item.download_url).then(function (response) {
            if (!response.ok) return null;
            return response.text().then(function (raw) { return toPost(item.name, raw); });
          });
        }));
      });
    }

    function publishedRepo() {
      var host = location.hostname;
      if (!/\.github\.io$/.test(host)) return "";
      var user = host.replace(/\.github\.io$/, "");
      var folder = (location.pathname.split("/").filter(Boolean)[0] || "");
      if (folder && folder.indexOf(".") === -1) return user + "/" + folder;
      return user + "/" + user + ".github.io";
    }

    function toPost(name, raw) {
      var parsed = parseFrontmatter(raw);
      var id = idFromName(name);
      return {
        id: id,
        name: name,
        title: parsed.data.title || titleFromName(name),
        date: /^\d{4}-\d{2}-\d{2}$/.test(parsed.data.date || "") ? parsed.data.date : "",
        description: parsed.data.description || "",
        markdown: parsed.body
      };
    }

    function idFromName(name) {
      var match = /^(\d+)/.exec(name);
      return match ? Number(match[1]) : 0;
    }

    function titleFromName(name) {
      return name.replace(/\.md$/i, "").replace(/^\d+-/, "").replace(/[-_]+/g, " ").trim() || name;
    }

    function show() {
      var name = decodeURIComponent(location.hash.slice(1));
      var post = posts.find(function (item) { return item.name === name; });
      if (post) {
        blog.innerHTML = article(post);
        return;
      }
      var pages = pageCount();
      var page = currentPage();
      if (page > pages) page = pages;
      blog.innerHTML = list(page, pages);
    }

    function pageCount() {
      var maxId = 0;
      posts.forEach(function (post) { if (post.id > maxId) maxId = post.id; });
      return Math.max(1, Math.ceil(maxId / PAGE));
    }

    function currentPage() {
      var page = Number(new URLSearchParams(location.search).get("page") || "1");
      return page > 0 ? page : 1;
    }

    function list(page, pages) {
      var start = (page - 1) * PAGE + 1;
      var slice = posts.filter(function (post) { return post.id >= start && post.id < start + PAGE; });
      var items = slice.map(function (post) {
        return "<li><a href=\"?page=" + page + "#" + encodeURIComponent(post.name) + "\">" +
          (post.date ? "<time datetime=\"" + escapeHtml(post.date) + "\">" + escapeHtml(formatDate(post.date)) + "</time>" : "") +
          "<h2>" + escapeHtml(post.title) + "</h2>" +
          (post.description ? "<p>" + escapeHtml(post.description) + "</p>" : "") +
          "</a></li>";
      }).join("");
      return "<h1>Blog</h1>" + (items ? "<ul class=\"posts\">" + items + "</ul>" : "") + pager(page, pages);
    }

    function pager(page, pages) {
      var html = "<nav class=\"pager\" aria-label=\"Páginas\">";
      html += page > 1 ? "<a href=\"?page=" + (page - 1) + "\">Anterior</a>" : "<span>Anterior</span>";
      for (var i = 1; i <= pages; i += 1) {
        html += i === page ? "<span aria-current=\"page\">" + i + "</span>" : "<a href=\"?page=" + i + "\">" + i + "</a>";
      }
      html += page < pages ? "<a href=\"?page=" + (page + 1) + "\">Siguiente</a>" : "<span>Siguiente</span>";
      return html + "</nav>";
    }

    function article(post) {
      return "<article class=\"article\"><h1>" + escapeHtml(post.title) + "</h1>" +
        (post.date ? "<time class=\"when\" datetime=\"" + escapeHtml(post.date) + "\">" + escapeHtml(formatDate(post.date)) + "</time>" : "") +
        "<div class=\"content\">" + renderMarkdown(post.markdown) + "</div></article>";
    }

    function parseFrontmatter(raw) {
      var text = String(raw).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n");
      var match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
      var data = {};
      if (!match) return { data: data, body: text.trim() };
      match[1].split("\n").forEach(function (line) {
        var field = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
        if (!field) return;
        data[field[1]] = field[2].trim().replace(/^["']|["']$/g, "");
      });
      return { data: data, body: text.slice(match[0].length).trim() };
    }

    function renderMarkdown(source) {
      var lines = source.replace(/\r\n/g, "\n").split("\n");
      var html = "";
      var i = 0;
      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim()) { i += 1; continue; }
        if (line.indexOf("```") === 0) {
          var code = [];
          i += 1;
          while (i < lines.length && lines[i].indexOf("```") !== 0) { code.push(lines[i]); i += 1; }
          i += 1;
          html += "<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>";
          continue;
        }
        var heading = /^(#{1,3}) /.exec(line);
        if (heading) {
          var tag = heading[1].length < 3 ? "h2" : "h3";
          html += "<" + tag + ">" + inline(line.slice(heading[1].length + 1)) + "</" + tag + ">";
          i += 1;
          continue;
        }
        if (line.indexOf("> ") === 0) {
          var quote = [];
          while (i < lines.length && lines[i].indexOf("> ") === 0) { quote.push(lines[i].slice(2)); i += 1; }
          html += "<blockquote><p>" + inline(quote.join(" ")) + "</p></blockquote>";
          continue;
        }
        if (/^[-*] /.test(line)) {
          var items = [];
          while (i < lines.length && /^[-*] /.test(lines[i])) { items.push("<li>" + inline(lines[i].slice(2)) + "</li>"); i += 1; }
          html += "<ul>" + items.join("") + "</ul>";
          continue;
        }
        var paragraph = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3} |```|> |[-*] )/.test(lines[i])) { paragraph.push(lines[i]); i += 1; }
        html += "<p>" + inline(paragraph.join(" ")) + "</p>";
      }
      return html;
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href=\"$2\">$1</a>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    }

    function formatDate(iso) {
      var parts = iso.split("-");
      return new Intl.DateTimeFormat("es-CO", { day: "numeric", month: "long", year: "numeric" }).format(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
